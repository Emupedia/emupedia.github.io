<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Snowflakes Effect</title>
	<style>
		*, *::before, *::after {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			height: 100%;
		}

		body {
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(180deg, #0b1a2e 0%, #1a3a5c 45%, #2d5a7b 100%);
			color: #e8f4ff;
		}

		.demo-content {
			position: relative;
			z-index: 2;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 2rem;
			text-align: center;
			pointer-events: none;
		}

		.demo-content h1 {
			margin: 0 0 0.5rem;
			font-size: clamp(1.75rem, 4vw, 2.75rem);
			font-weight: 600;
			text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45);
		}

		.demo-content p {
			margin: 0 0 1.5rem;
			max-width: 36rem;
			line-height: 1.5;
			opacity: 0.9;
		}

		.demo-controls {
			display: flex;
			flex-wrap: wrap;
			gap: 0.75rem;
			justify-content: center;
			pointer-events: auto;
		}

		.demo-controls label,
		.demo-controls button,
		.demo-controls select {
			font: inherit;
		}

		.demo-controls label {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.55rem 0.85rem;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.12);
			backdrop-filter: blur(8px);
		}

		.demo-controls input[type="range"] {
			width: 7rem;
		}

		.demo-controls select {
			padding: 0.35rem 0.65rem;
			border: 0;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.92);
			color: #12324f;
			cursor: pointer;
		}

		.demo-controls button {
			padding: 0.55rem 1rem;
			border: 0;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.92);
			color: #12324f;
			cursor: pointer;
		}

		.demo-controls button:hover {
			background: #fff;
		}

		.snowfall-container {
			animation-fill-mode: none;
			pointer-events: none;
			z-index: 1;
			position: absolute;
			top: 0;
			right: 0;
			bottom: 0;
			left: 0;
			overflow: visible;
		}

		.snowfall-container.is-fixed {
			position: fixed;
		}

		/* ── Generic v1 + Generic v2 ── */
		.snowfall-container.mode-generic-v1 .generic-flake,
		.snowfall-container.mode-generic-v2 .generic-flake {
			position: absolute;
			top: -200px;
			animation-fill-mode: forwards;
		}

		.snowfall-container.mode-generic-v1 .generic-flake {
			animation-timing-function: ease-out;
		}

		.snowfall-container.mode-generic-v2 .generic-flake {
			animation-timing-function: linear;
		}

		.snowfall-container.mode-generic-v2 .generic-v2-flake {
			position: absolute;
			top: -200px;
			animation-name: emuos-shake;
			animation-duration: 3s;
			animation-timing-function: ease-in-out;
			animation-iteration-count: infinite;
			animation-play-state: running;
		}

		.snowfall-container.mode-generic-v2 .generic-v2-flake .generic-flake {
			position: relative;
			top: auto;
			left: auto;
		}

		.snowfall-container.mode-generic-v1 .generic-flake img,
		.snowfall-container.mode-generic-v2 .generic-flake img {
			display: block;
			pointer-events: none;
			user-select: none;
		}

		.snowfall-container.mode-generic-v1 .generic-flake-rotate,
		.snowfall-container.mode-generic-v2 .generic-flake-rotate,
		.snowfall-container.mode-emuos .emuos-snowflake-rotate,
		.snowfall-container.mode-emuos-v2 .emuos-v2-flake-rotate {
			display: inline-block;
			animation-name: flake-2d-tumble;
			animation-timing-function: linear;
			animation-fill-mode: forwards;
			animation-play-state: running;
		}

		.snowfall-container.mode-generic-v1 .generic-flake.has-spin,
		.snowfall-container.mode-generic-v2 .generic-flake.has-spin {
			transform-style: preserve-3d;
		}

		.snowfall-container.mode-generic-v1 .generic-flake.has-spin img,
		.snowfall-container.mode-generic-v2 .generic-flake.has-spin img {
			animation-name: emuos-spin;
			animation-duration: 2s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: running;
		}

		.snowfall-container.mode-generic-v1 .generic-flake-0,
		.snowfall-container.mode-generic-v2 .generic-flake-0 { animation-name: generic-path-0; }
		.snowfall-container.mode-generic-v1 .generic-flake-1,
		.snowfall-container.mode-generic-v2 .generic-flake-1 { animation-name: generic-path-1; }
		.snowfall-container.mode-generic-v1 .generic-flake-2,
		.snowfall-container.mode-generic-v2 .generic-flake-2 { animation-name: generic-path-2; }
		.snowfall-container.mode-generic-v1 .generic-flake-3,
		.snowfall-container.mode-generic-v2 .generic-flake-3 { animation-name: generic-path-3; }
		.snowfall-container.mode-generic-v1 .generic-flake-4,
		.snowfall-container.mode-generic-v2 .generic-flake-4 { animation-name: generic-path-4; }
		.snowfall-container.mode-generic-v1 .generic-flake-5,
		.snowfall-container.mode-generic-v2 .generic-flake-5 { animation-name: generic-path-5; }
		.snowfall-container.mode-generic-v1 .generic-flake-6,
		.snowfall-container.mode-generic-v2 .generic-flake-6 { animation-name: generic-path-6; }
		.snowfall-container.mode-generic-v1 .generic-flake-7,
		.snowfall-container.mode-generic-v2 .generic-flake-7 { animation-name: generic-path-7; }
		.snowfall-container.mode-generic-v1 .generic-flake-8,
		.snowfall-container.mode-generic-v2 .generic-flake-8 { animation-name: generic-path-8; }
		.snowfall-container.mode-generic-v1 .generic-flake-9,
		.snowfall-container.mode-generic-v2 .generic-flake-9 { animation-name: generic-path-9; }
		.snowfall-container.mode-generic-v1 .generic-flake-10,
		.snowfall-container.mode-generic-v2 .generic-flake-10 { animation-name: generic-path-10; }
		.snowfall-container.mode-generic-v1 .generic-flake-11,
		.snowfall-container.mode-generic-v2 .generic-flake-11 { animation-name: generic-path-11; }
		.snowfall-container.mode-generic-v1 .generic-flake-12,
		.snowfall-container.mode-generic-v2 .generic-flake-12 { animation-name: generic-path-12; }
		.snowfall-container.mode-generic-v1 .generic-flake-13,
		.snowfall-container.mode-generic-v2 .generic-flake-13 { animation-name: generic-path-13; }
		.snowfall-container.mode-generic-v1 .generic-flake-14,
		.snowfall-container.mode-generic-v2 .generic-flake-14 { animation-name: generic-path-14; }
		.snowfall-container.mode-generic-v1 .generic-flake-15,
		.snowfall-container.mode-generic-v2 .generic-flake-15 { animation-name: generic-path-15; }
		.snowfall-container.mode-generic-v1 .generic-flake-16,
		.snowfall-container.mode-generic-v2 .generic-flake-16 { animation-name: generic-path-16; }
		.snowfall-container.mode-generic-v1 .generic-flake-17,
		.snowfall-container.mode-generic-v2 .generic-flake-17 { animation-name: generic-path-17; }
		.snowfall-container.mode-generic-v1 .generic-flake-18,
		.snowfall-container.mode-generic-v2 .generic-flake-18 { animation-name: generic-path-18; }
		.snowfall-container.mode-generic-v1 .generic-flake-19,
		.snowfall-container.mode-generic-v2 .generic-flake-19 { animation-name: generic-path-19; }
		.snowfall-container.mode-generic-v1 .generic-flake-20,
		.snowfall-container.mode-generic-v2 .generic-flake-20 { animation-name: generic-path-20; }

		@keyframes generic-path-0 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(73px, 130vh) rotate(-349deg); }
		}

		@keyframes generic-path-1 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(188px, 130vh) rotate(423deg); }
		}

		@keyframes generic-path-2 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(120px, 130vh) rotate(140deg); }
		}

		@keyframes generic-path-3 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-8px, 130vh) rotate(311deg); }
		}

		@keyframes generic-path-4 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(3px, 130vh) rotate(114deg); }
		}

		@keyframes generic-path-5 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(67px, 130vh) rotate(394deg); }
		}

		@keyframes generic-path-6 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(131px, 130vh) rotate(162deg); }
		}

		@keyframes generic-path-7 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-53px, 130vh) rotate(-4deg); }
		}

		@keyframes generic-path-8 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-79px, 130vh) rotate(-260deg); }
		}

		@keyframes generic-path-9 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-179px, 130vh) rotate(405deg); }
		}

		@keyframes generic-path-10 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(155px, 130vh) rotate(370deg); }
		}

		@keyframes generic-path-11 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-184px, 130vh) rotate(278deg); }
		}

		@keyframes generic-path-12 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-4px, 130vh) rotate(440deg); }
		}

		@keyframes generic-path-13 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-42px, 130vh) rotate(-265deg); }
		}

		@keyframes generic-path-14 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-114px, 130vh) rotate(-393deg); }
		}

		@keyframes generic-path-15 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-10px, 130vh) rotate(-333deg); }
		}

		@keyframes generic-path-16 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-108px, 130vh) rotate(192deg); }
		}

		@keyframes generic-path-17 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-138px, 130vh) rotate(-172deg); }
		}

		@keyframes generic-path-18 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-64px, 130vh) rotate(185deg); }
		}

		@keyframes generic-path-19 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(88px, 130vh) rotate(241deg); }
		}

		@keyframes generic-path-20 {
			from { transform: translate(0, 0) rotate(0deg); }
			to { transform: translate(-120px, 130vh) rotate(341deg); }
		}

		/* ── Generic v3: lightweight continuous PNG flakes ── */
		.snowfall-container.mode-generic-v3 .generic-v3-flake {
			position: absolute;
			top: -200px;
			contain: layout style;
		}

		.snowfall-container.mode-generic-v3 .generic-v3-flake img {
			display: block;
			pointer-events: none;
			user-select: none;
		}

		.snowfall-container.mode-generic-v3 .generic-v3-flake.has-spin {
			transform-style: preserve-3d;
		}

		.snowfall-container.mode-generic-v3 .generic-v3-flake.has-spin img {
			animation-name: emuos-spin;
			animation-duration: 2s;
			animation-timing-function: linear;
			animation-iteration-count: infinite;
			animation-play-state: running;
		}

		/* ── EmuOS mode (from assets/styles/css/themes/seasonal/xmas/snowflakes.css) ── */
		.snowfall-container.mode-emuos .emuos-snowflakes {
			position: fixed;
			top: -10%;
			animation-name: emuos-fall, emuos-shake;
			animation-duration: 10s, 3s;
			animation-timing-function: linear, ease-in-out;
			animation-play-state: running, running;
			transform-style: preserve-3d;
			z-index: 1;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.is-once {
			animation-iteration-count: 1, infinite;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.is-loop {
			animation-iteration-count: infinite, infinite;
		}

		.snowfall-container.mode-emuos .emuos-snowflake {
			color: #fff;
			font-size: 2em;
			font-family: Arial, sans-serif;
			user-select: none;
			pointer-events: none;
			cursor: default;
		}

		.snowfall-container.mode-emuos .emuos-snowflake.has-spin {
			animation-name: emuos-spin;
			animation-duration: 2s;
			animation-timing-function: linear;
			animation-play-state: running;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.is-once .emuos-snowflake.has-spin {
			animation-iteration-count: 1;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.is-loop .emuos-snowflake.has-spin {
			animation-iteration-count: infinite;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.has-shadow {
			text-shadow: 0 0 5px #000;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.is-once .emuos-snowflake-rotate {
			animation-iteration-count: 1;
		}

		.snowfall-container.mode-emuos .emuos-snowflakes.is-loop .emuos-snowflake-rotate {
			animation-iteration-count: infinite;
		}

		/* ── EmuOS v2: EmuOS motion with one PNG per flake ── */
		.snowfall-container.mode-emuos-v2 .emuos-v2-flake {
			position: fixed;
			top: -10%;
			animation-name: emuos-v2-fall, emuos-v2-shake;
			animation-duration: 10s, 3s;
			animation-timing-function: linear, ease-in-out;
			animation-play-state: running, running;
			transform-style: preserve-3d;
			z-index: 1;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.is-once {
			animation-iteration-count: 1, infinite;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.is-loop {
			animation-iteration-count: infinite, infinite;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.has-spin img,
		.snowfall-container.mode-emuos-v2 .emuos-v2-flake img.has-spin {
			display: block;
			animation-name: emuos-v2-spin;
			animation-duration: 2s;
			animation-timing-function: linear;
			animation-play-state: running;
			user-select: none;
			pointer-events: none;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake-rotate {
			display: inline-block;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake-rotate img {
			display: block;
			pointer-events: none;
			user-select: none;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.is-once .emuos-v2-flake-rotate {
			animation-iteration-count: 1;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.is-loop .emuos-v2-flake-rotate {
			animation-iteration-count: infinite;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.is-once img.has-spin {
			animation-iteration-count: 1;
		}

		.snowfall-container.mode-emuos-v2 .emuos-v2-flake.is-loop img.has-spin {
			animation-iteration-count: infinite;
		}

		@keyframes emuos-fall {
			0% { top: -10%; }
			100% { top: 100%; }
		}

		@keyframes emuos-shake {
			0% { transform: translateX(0); }
			50% { transform: translateX(80px); }
			100% { transform: translateX(0); }
		}

		@keyframes emuos-spin {
			0% { transform: rotate3d(1, 1, 1, 0deg); }
			50% { transform: rotate3d(1, 1, 1, 180deg); }
			100% { transform: rotate3d(1, 1, 1, 360deg); }
		}

		@keyframes emuos-v2-fall {
			0% { top: -10%; }
			100% { top: 100%; }
		}

		@keyframes emuos-v2-shake {
			0% { transform: translateX(0); }
			50% { transform: translateX(80px); }
			100% { transform: translateX(0); }
		}

		@keyframes flake-2d-tumble {
			from { transform: rotate(0deg); }
			to { transform: rotate(var(--fall-rotate, 360deg)); }
		}

		@keyframes emuos-v2-spin {
			0% { transform: rotate3d(1, 1, 1, 0deg); }
			50% { transform: rotate3d(1, 1, 1, 180deg); }
			100% { transform: rotate3d(1, 1, 1, 360deg); }
		}
	</style>
</head>
<body>
	<div class="demo-content">
		<h1>Snowflakes Effect</h1>
		<p id="mode-description">
			PNG snowfall or EmuOS desktop xmas snow — switch modes below.
		</p>
		<div class="demo-controls">
			<label>
				Mode
				<select id="mode">
					<option value="generic-v1" selected>Generic v1</option>
					<option value="generic-v2">Generic v2</option>
					<option value="generic-v3">Generic v3</option>
					<option value="emuos">EmuOS</option>
					<option value="emuos-v2">EmuOS v2</option>
				</select>
			</label>
			<label>
				Flakes
				<input id="count" type="range" min="1" max="500" step="5" value="21" />
				<span id="count-value">21</span>
			</label>
			<label>
				Speed
				<input id="speed" type="range" min="10" max="100" step="5" value="50" />
				<span id="speed-value">50</span>
			</label>
			<label>
				Rotate3D
				<input id="spin-rate" type="range" min="0" max="100" step="5" value="25" />
				<span id="spin-rate-value">25%</span>
			</label>
			<label for="loop">
				Loop
				<input id="loop" type="checkbox" checked />
			</label>
			<button id="restart" type="button">Restart</button>
			<button id="stop" type="button">Stop</button>
		</div>
	</div>

	<script>
		(function (global) {
			"use strict";

			var PATH_COUNT = 21;
			var FLAKE_BASE = "assets/images/effects/snowflakes/flake_";
			var MIN_2D_ROTATION = 25;
			var SLIGHT_2D_ROTATION_MAX = 90;
			var FULL_2D_ROTATION_MAX = 440;
			var GENERIC_V3_MIN_2D_ROTATION = 90;
			var GENERIC_V3_SLIGHT_2D_ROTATION_MAX = 240;
			var GENERIC_V3_SHAKE_PERIOD = 3;
			var GENERIC_V3_SHAKE_AMPLITUDE = 80;
			var GENERIC_V3_SAMPLE_INTERVAL = 0.3;
			var GENERIC_V3_KEYFRAME_CACHE_LIMIT = 512;
			var genericV3KeyframeCache = {};
			var genericV3KeyframeCacheKeys = [];
			var flakePreload = [];
			var flakePreloadPromise = null;

			var EMUOS_GLYPHS = ["❅", "❆"];
			var EMUOS_PRESETS = [
				{ left: "1%", fallDelay: "0s", shakeDelay: "0s", spinDelay: "0s", shadow: true },
				{ left: "10%", fallDelay: "1s", shakeDelay: "1s", spinDelay: "1s", shadow: true },
				{ left: "20%", fallDelay: "6s", shakeDelay: "0.5s", spinDelay: "6s", shadow: true },
				{ left: "30%", fallDelay: "4s", shakeDelay: "2s", spinDelay: "4s", shadow: true },
				{ left: "40%", fallDelay: "2s", shakeDelay: "2s", spinDelay: "2s", shadow: true },
				{ left: "50%", fallDelay: "8s", shakeDelay: "3s", spinDelay: "8s", shadow: true },
				{ left: "60%", fallDelay: "6s", shakeDelay: "2s", spinDelay: "6s", shadow: true },
				{ left: "70%", fallDelay: "2.5s", shakeDelay: "1s", spinDelay: "2.5s", shadow: true },
				{ left: "80%", fallDelay: "1s", shakeDelay: "0s", spinDelay: "1s", shadow: true },
				{ left: "90%", fallDelay: "3s", shakeDelay: "1.5s", spinDelay: "3s", shadow: true },
				{ left: "5%", fallDelay: "3s", shakeDelay: "1.5s", spinDelay: "3s", shadow: false },
				{ left: "15%", fallDelay: "1s", shakeDelay: "0s", spinDelay: "1s", shadow: false },
				{ left: "25%", fallDelay: "2.5s", shakeDelay: "1s", spinDelay: "2.5s", shadow: false },
				{ left: "35%", fallDelay: "6s", shakeDelay: "2s", spinDelay: "6s", shadow: false },
				{ left: "45%", fallDelay: "8s", shakeDelay: "3s", spinDelay: "8s", shadow: false },
				{ left: "55%", fallDelay: "2s", shakeDelay: "2s", spinDelay: "2s", shadow: false },

				return element;
			};

			SnowfallEffect.prototype.fillGenericV2Pool = function () {
				while (this.running && this.options.loop && this.activeFlakes.length < this.options.count) {
					this.spawnGenericV1Flake(0);
				}
			};

			SnowfallEffect.prototype.spawnGenericV2Burst = function () {
				var avgDuration = 5.5 * getSpeedMultiplier(this.options.speed);
				var i;

				for (i = 0; i < this.options.count; i++) {
					this.spawnGenericV1Flake((i / this.options.count) * avgDuration);
				}
			};

			SnowfallEffect.prototype.spawnBurst = function () {
				var container = this.ensureContainer();
				var i;

				this.clearFlakes();
				this.pathCounter = 0;

				for (i = 0; i < this.options.count; i++) {
					if (this.options.mode === "emuos") {
						this.activeFlakes.push(createEmuosFlake(
							i,
							this.options.loop,
							this.options.speed,
							shouldSpin3d(this.options.spinRate)
						));
						container.appendChild(this.activeFlakes[this.activeFlakes.length - 1]);
					} else if (this.options.mode === "emuos-v2") {
						this.activeFlakes.push(createEmuosV2Flake(
							this.options.loop,
							this.options.speed,
							shouldSpin3d(this.options.spinRate)
						));
						container.appendChild(this.activeFlakes[this.activeFlakes.length - 1]);
					} else if (this.options.mode === "generic-v2") {
						this.spawnGenericV2Burst();
						break;
					} else if (this.options.mode === "generic-v3") {
						this.spawnGenericV3Burst();
						break;
					} else if (this.options.mode === "generic-v1") {
						this.spawnGenericV1Flake();
					}
				}
			};

			SnowfallEffect.prototype.onPathAnimationEnd = function (event) {
				if (!isGenericMode(this.options.mode) || this.options.mode === "generic-v3") {
					return;
				}

				var pathFlake = event.currentTarget;
				var tracked = getTrackedFlake(pathFlake);

				if (event.animationName.indexOf("generic-path-") !== 0) {
					return;
				}

				pathFlake.removeEventListener("animationend", this.onPathAnimationEnd);

				var index = this.activeFlakes.indexOf(tracked);
				if (index !== -1) {
					this.activeFlakes.splice(index, 1);
				}

				if (tracked.parentNode) {
					tracked.parentNode.removeChild(tracked);
				}

				if (!this.running) {
					return;
				}

				if (this.options.mode === "generic-v2") {
					if (this.options.loop) {
						this.spawnGenericV1Flake(0);
						this.fillGenericV2Pool();
					}

					return;
				}

				if (this.activeFlakes.length === 0 && this.options.loop) {
					this.pendingRestart = setTimeout(function () {
						this.pendingRestart = null;
						if (this.running) {
							this.spawnBurst();
						}
					}.bind(this), 250);
				}
			};

			SnowfallEffect.prototype.start = function () {
				if (this.running) {
					return this;
				}

				this.running = true;

				if (this.options.mode === "generic-v3") {
					preloadFlakeImages().then(function () {
						if (this.running) {
							this.spawnBurst();
						}
					}.bind(this));
					return this;
				}

				this.spawnBurst();
				return this;
			};

			SnowfallEffect.prototype.stop = function () {
				this.running = false;
				this.clearFlakes();
				return this;
			};

			SnowfallEffect.prototype.restart = function () {
				this.running = false;
				this.clearFlakes();
				this.running = true;

				if (this.options.mode === "generic-v3") {
					preloadFlakeImages().then(function () {
						if (this.running) {
							this.spawnBurst();
						}
					}.bind(this));
					return this;
				}

				this.spawnBurst();
				return this;
			};

			SnowfallEffect.prototype.setOptions = function (options) {
				var next = mergeOptions(Object.assign({}, this.options, options || {}));
				var modeChanged = next.mode !== this.options.mode;

				this.options = next;

				if (modeChanged) {
					this.clearFlakes(true);

					if (this.container && this.container.parentNode) {
						this.container.parentNode.removeChild(this.container);
					}

					this.container = null;
				}

				return this;
			};

			SnowfallEffect.prototype.destroy = function () {
				document.removeEventListener("visibilitychange", this.onVisibilityChange);
				this.stop();
				this.genericV3Pool = [];

				if (this.container && this.container.parentNode) {
					this.container.parentNode.removeChild(this.container);
				}

				this.container = null;
				return this;
			};

			var api = {
				mount: function (root, options) {
					if (!root) {
						throw new Error("SnowfallEffect.mount requires a root element.");
					}

					return new SnowfallEffect(root, options);
				},
				preload: preloadFlakeImages
			};

			global.SnowfallEffect = api;

			var SETTINGS_STORAGE_KEY = "snowflakes-demo-settings";

			function loadSettings() {
				var defaults = {
					mode: "generic-v1",
					count: 21,
					speed: 50,
					spinRate: 25,
					loop: true
				};

				try {
					var saved = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY));

					if (!saved || typeof saved !== "object") {
						return defaults;
					}

					return {
						mode: normalizeMode(saved.mode),
						count: Math.min(500, Math.max(1, Number(saved.count) || defaults.count)),
						speed: Math.min(100, Math.max(10, Number(saved.speed) || defaults.speed)),
						spinRate: Math.min(100, Math.max(0, Number(saved.spinRate) || defaults.spinRate)),
						loop: saved.loop !== false
					};
				} catch (error) {
					return defaults;
				}
			}

			function saveSettings(settings) {
				try {
					localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
				} catch (error) {
					// ignore quota / privacy errors
				}
			}

			document.addEventListener("DOMContentLoaded", function () {
				var savedSettings = loadSettings();

				var modeSelect = document.getElementById("mode");
				var modeDescription = document.getElementById("mode-description");
				var countInput = document.getElementById("count");
				var countValue = document.getElementById("count-value");
				var speedInput = document.getElementById("speed");
				var speedValue = document.getElementById("speed-value");
				var spinRateInput = document.getElementById("spin-rate");
				var spinRateValue = document.getElementById("spin-rate-value");
				var loopInput = document.getElementById("loop");
				var restartButton = document.getElementById("restart");
				var stopButton = document.getElementById("stop");

				var modeDescriptions = {
					"generic-v1": "Path-based PNG snowfall — flakes on 21 fixed fall paths.",
					"generic-v2": "Continuous individual PNG flakes with EmuOS sway — one image per flake, random path and placement.",
					"generic-v3": "Performance Generic v2 — pooled DOM, cached motion paths, preloaded PNGs, pauses when tab hidden.",
					emuos: "EmuOS desktop xmas snow — unicode flakes with fall, shake, and spin.",
					"emuos-v2": "EmuOS motion with PNG flakes — 2D path rotation on every flake, optional rotate3d."
				};

				function applySettingsToUI(settings) {
					modeSelect.value = settings.mode;
					countInput.value = String(settings.count);
					countValue.textContent = String(settings.count);
					speedInput.value = String(settings.speed);
					speedValue.textContent = String(settings.speed);
					spinRateInput.value = String(settings.spinRate);
					spinRateValue.textContent = settings.spinRate + "%";
					loopInput.checked = settings.loop;
					modeDescription.textContent = modeDescriptions[settings.mode];
				}

				function readOptions() {
					return {
						mode: modeSelect.value,
						count: Number(countInput.value),
						speed: Number(speedInput.value),
						spinRate: Number(spinRateInput.value),
						loop: loopInput.checked
					};
				}

				function persistSettings() {
					saveSettings(readOptions());
				}

				applySettingsToUI(savedSettings);
				preloadFlakeImages();

				var effect = api.mount(document.body, Object.assign({ fixed: true }, savedSettings));
				effect.start();

				modeSelect.addEventListener("change", function () {
					modeDescription.textContent = modeDescriptions[modeSelect.value];
					effect.setOptions(readOptions());
					persistSettings();
					effect.restart();
				});

				countInput.addEventListener("input", function () {
					countValue.textContent = countInput.value;
					persistSettings();
				});

				speedInput.addEventListener("input", function () {
					speedValue.textContent = speedInput.value;
					effect.setOptions({ speed: Number(speedInput.value) });
					persistSettings();
					if (effect.running) {
						effect.restart();
					}
				});

				spinRateInput.addEventListener("input", function () {
					spinRateValue.textContent = spinRateInput.value + "%";
					effect.setOptions({ spinRate: Number(spinRateInput.value) });
					persistSettings();
					if (effect.running) {
						effect.restart();
					}
				});

				loopInput.addEventListener("change", function () {
					effect.setOptions({ loop: loopInput.checked });
					persistSettings();
					if (effect.running) {
						effect.restart();
					}
				});

				restartButton.addEventListener("click", function () {
					effect.setOptions(readOptions());
					persistSettings();
					effect.restart();
				});

				stopButton.addEventListener("click", function () {
					effect.stop();
				});
			});
		})(window);
	</script>
</body>
</html>
